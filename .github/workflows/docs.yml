# The theme's docs, built on every push to main and served by GitHub Pages
# at hyphatech.github.io/starlight-theme-hypha. The tests run first: docs
# that build from a broken theme are not published.
name: docs

on:
  push:
    branches: [main]
  # A pull request is built, as main's check, and never deployed.
  pull_request:
  workflow_dispatch:

# A build reads the repository and nothing more; the deploy job alone
# is given the rights to publish.
permissions:
  contents: read

# A newer push to a pull request replaces its build; main's deploys
# queue and always finish.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: make setup
      - run: make lint
      - run: make test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The site as a host serves it, built apart from the test's.
      - run: make build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _build/docs
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
